<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>あなたの番号</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;background:linear-gradient(#fff6ea,#ffe2bf);color:#4a2a10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.lead{font-size:22px;font-weight:bold;margin:0 0 8px}
.card{background:#fff;border:5px solid #e8650a;border-radius:28px;padding:18px 36px 10px;min-width:260px;box-shadow:0 8px 24px rgba(200,90,0,.18)}
.num{font-size:150px;font-weight:bold;line-height:1.05;color:#c24f00;letter-spacing:-2px}
.num small{font-size:44px;margin-left:4px}
.note{font-size:19px;line-height:1.7;margin-top:22px}
.err{font-size:20px;line-height:1.7;color:#8a2a00}
button{font:inherit;font-size:22px;font-weight:bold;margin-top:16px;padding:14px 34px;border:0;border-radius:40px;background:#e8650a;color:#fff}
.wait{font-size:26px}
.dots::after{content:"";animation:d 1.2s infinite}
@keyframes d{0%{content:""}33%{content:"・"}66%{content:"・・"}100%{content:"・・・"}}
</style></head><body>
<main id="m" aria-live="polite"><p class="wait">番号をお配りしています<span class="dots"></span></p></main>
<script>
const API="https://script.google.com/macros/s/AKfycbxJhpMJG1srTCm4jzV-jy6cMCMEJ4tZyrmvVqI5tx8w3bXsp__wLmSo9IblYWJdK1uW/exec";
const KEY="saga_bango_v1";
const m=document.getElementById('m');
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function newCid(){const a=new Uint8Array(18);(crypto||msCrypto).getRandomValues(a);return Array.from(a,b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join('')}
function show(n){
  m.innerHTML='<p class="lead">あなたの番号は</p><div class="card"><div class="num">'+n+'<small>ばん</small></div></div>'
   +'<p class="note">このあと、この番号でくじを引きます。<br>画面はこのままでも、閉じても大丈夫です。<br>当たっても、前に出たり話したりはしません。</p>';
  document.title='あなたは '+n+' ばん';
}
function fail(msg){
  m.innerHTML='<p class="err">'+msg+'</p><button id="r">もう一度</button>';
  document.getElementById('r').onclick=go;
}
async function go(){
  const s=load(); if(!s.cid){s.cid=newCid();save(s)}
  if(s.n) show(s.n); else m.innerHTML='<p class="wait">番号をお配りしています<span class="dots"></span></p>';
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(API+'?a=take&cid='+encodeURIComponent(s.cid),{signal:ctl.signal,cache:'no-store'});
    const j=await r.json();
    if(j.ok){s.n=j.n;s.round=j.round;save(s);show(j.n);return}
    if(j.error==='full'){fail('番号がいっぱいになりました。<br>お近くの係の者にお声がけください。');return}
    if(!s.n) fail('混み合っています。<br>少し待って「もう一度」を押してください。');
  }catch(e){
    if(!s.n) fail('つながりにくいようです。<br>少し待って「もう一度」を押してください。<br>だめなときは、係の者が紙の番号をお渡しします。');
  }finally{clearTimeout(t)}
}
go();
</script></body></html>
